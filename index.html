<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Equalizer landing page</title>
  </head>
  <body>
    <div class="main-bg-pattern"></div>
    <main>
      <section class="hero">
        <img src="./assets/logo.svg" alt=" Equalizer Logo" class="logo" />
        <div class="hero-text-container">
          <h1>We make your music sound extraordinary</h1>
          <p>
            A system audio equalizer specifically designed for Android and iOS.
            Freely tune the way your music sounds with a professional grade
            parametric EQ & volume mixer. Control bass, mids, treble, gain
            control, reverb, and more!
          </p>
        </div>
      </section>
      <section class="mobile-illustration">
        <img
          src="./assets/illustration-app.png"
          alt=""
          class="mobile-phone-image"
        />
        <div class="mobile-illustration-top">
          <img
            src="./assets/bg-pattern-2.svg"
            alt=""
            class="illustration-bg-image"
          />
        </div>
        <div class="mobile-illustration-bottom"></div>
      </section>
    </main>
  </body>
</html>
